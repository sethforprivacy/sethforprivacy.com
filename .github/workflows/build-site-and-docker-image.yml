name: Build site and deploy custom image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            resources/_gen
            /home/runner/.cache/hugo_cache
          key: hugo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('hugo.yaml', 'tor_config.yml', 'assets/**', 'layouts/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build clearnet
        run: hugo --destination ./public

      - name: Build Tor
        run: hugo --config hugo.yaml,tor_config.yml --destination ./tor

      - name: Install zopfli
        run: sudo apt-get install -y --no-install-recommends zopfli

      - name: Compress public static files
        run: |
          cd public
          find . -type f ! -name '*.gz' -exec sh -c '
            for f do
              zopfli "$f"
              rm "$f"
              touch -r "$f".gz "$f"
            done
          ' sh {} +

      - name: Compress Tor static files
        run: |
          cd tor
          find . -type f ! -name '*.gz' -exec sh -c '
            for f do
              zopfli "$f"
              rm "$f"
              touch -r "$f".gz "$f"
            done
          ' sh {} +

      - name: Set image creation timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push to Github Packages Docker Registry
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blog:latest
            ghcr.io/${{ github.repository_owner }}/blog:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog:latest
          cache-to: type=inline

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
